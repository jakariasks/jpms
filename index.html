<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#153d35" />
    <meta
      name="description"
      content="JPMS — your personal workspace for money, teaching, tasks and everyday life."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>JPMS | Jakaria Personal Management System</title>
    <script>
      try {
        var t = localStorage.getItem('jpms-theme') || 'system';
        document.documentElement.classList.toggle(
          'dark',
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches),
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
